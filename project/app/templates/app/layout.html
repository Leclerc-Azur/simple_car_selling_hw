{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Car List{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .car-card img {
            object-fit: cover;
            height: 200px;
        }
        .car-description {
            color: #6c757d;
            font-size: 14px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4">

        <div class="mb-3 text-end">
            <a href="{% url 'add_car' %}" class="btn btn-outline-primary">Добавить машину</a>
        </div>

        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
