{% extends 'app/layout.html' %}
{% block title %}Добавление машины{% endblock %}

{% block content %}
  <h2>Добавить машину</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Добавить</button>
  </form>
{% endblock %}
